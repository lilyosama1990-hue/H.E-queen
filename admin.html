<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | H.E-queen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #2b2b2b; color: #fff; border: 1px solid #d4af37; border-radius: 12px; }
        .btn-gold { background-color: #d4af37; color: #000; font-weight: bold; }
        .btn-gold:hover { background-color: #b59328; color: #fff; }
        .product-img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body class="py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-warning"><i class="fas fa-crown me-2"></i>لوحة إدارة منتجات H.E-queen</h2>
            <a href="index.html" class="btn btn-outline-light"><i class="fas fa-store me-1"></i> الذهاب للمتجر</a>
        </div>

        <div class="row g-4">
            <!-- Form to Add Product -->
            <div class="col-md-5">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3 text-warning"><i class="fas fa-plus-circle me-2"></i>إضافة منتج جديد</h5>
                    <form id="addProductForm" onsubmit="saveProduct(event)">
                        <div class="mb-3">
                            <label class="form-label">اسم المنتج</label>
                            <input type="text" id="pName" class="form-control" placeholder="مثال: فستان سواريه" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">السعر (ج.م)</label>
                            <input type="number" id="pPrice" class="form-control" placeholder="مثال: 750" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">رابط الصورة (URL)</label>
                            <input type="url" id="pImg" class="form-control" placeholder="ضع رابط الصورة هنا" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100 py-2"><i class="fas fa-save me-1"></i> حفظ وإضافة للمتجر</button>
                    </form>
                </div>
            </div>

            <!-- List of Existing Products -->
            <div class="col-md-7">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3 text-warning"><i class="fas fa-boxes me-2"></i>المنتجات الحالية</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>الصورة</th>
                                    <th>الاسم</th>
                                    <th>السعر</th>
                                    <th>إجراء</th>
                                </tr>
                            </thead>
                            <tbody id="adminProductsList">
                                <!-- Products loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, name: "فستان سهرة أنيق", price: 850, img: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?q=80&w=500" },
            { id: 2, name: "عباية مودرن شيك", price: 650, img: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=500" },
            { id: 3, name: "بلوزة حرير راقية", price: 420, img: "https://images.unsplash.com/photo-1604014237800-1c9102c219da?q=80&w=500" },
            { id: 4, name: "طقم كاجوال كامل", price: 950, img: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=500" }
        ];

        function getProducts() {
            const stored = localStorage.getItem('he_queen_custom_products');
            if (!stored) {
                localStorage.setItem('he_queen_custom_products', JSON.stringify(defaultProducts));
                return defaultProducts;
            }
            return JSON.parse(stored);
        }

        function renderAdminProducts() {
            const products = getProducts();
            const tbody = document.getElementById('adminProductsList');
            tbody.innerHTML = products.map((p, index) => `
                <tr>
                    <td><img src="${p.img}" class="product-img-preview" alt="${p.name}"></td>
                    <td>${p.name}</td>
                    <td>${p.price} ج.م</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${index})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function saveProduct(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value.trim();
            const price = parseFloat(document.getElementById('pPrice').value);
            const img = document.getElementById('pImg').value.trim();

            const products = getProducts();
            products.push({ id: Date.now(), name, price, img });
            localStorage.setItem('he_queen_custom_products', JSON.stringify(products));

            document.getElementById('addProductForm').reset();
            renderAdminProducts();
            alert('تمت إضافة المنتج بنجاح ومزامنته مع المتجر!');
        }

        function deleteProduct(index) {
            if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
                const products = getProducts();
                products.splice(index, 1);
                localStorage.setItem('he_queen_custom_products', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        renderAdminProducts();
    </script>
</body>
</html>
