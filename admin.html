<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | H.E-queen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #2b2b2b; color: #fff; border: 1px solid #d4af37; border-radius: 12px; }
        .btn-gold { background-color: #d4af37; color: #000; font-weight: bold; }
        .btn-gold:hover { background-color: #b59328; color: #fff; }
        .product-img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body class="py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-warning"><i class="fas fa-crown me-2"></i>لوحة إدارة H.E-queen</h2>
            <a href="index.html" class="btn btn-outline-light btn-sm"><i class="fas fa-store me-1"></i> المتجر</a>
        </div>

        <div class="row g-4">
            <!-- 1. تعديل البانر والكلمات -->
            <div class="col-md-5">
                <div class="card p-3 mb-4 border-info">
                    <h5 class="fw-bold mb-3 text-info"><i class="fas fa-image me-2"></i>تعديل الغلاف العالي (البانر)</h5>
                    <form onsubmit="saveBanner(event)">
                        <div class="mb-2">
                            <label class="form-label small">العنوان الرئيسي</label>
                            <input type="text" id="bTitle" class="form-control form-control-sm" placeholder="أحدث صيحات الموضة والأنقاة">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">الوصف الفرعي</label>
                            <input type="text" id="bDesc" class="form-control form-control-sm" placeholder="تسوقي أحدث التشكيلات حصرياً من H.E-queen">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">اختر صورة الغلاف من الاستوديو</label>
                            <input type="file" id="bImgFile" class="form-control form-control-sm" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-info btn-sm w-100 fw-bold text-dark">حفظ تعديلات الغلاف</button>
                    </form>
                </div>

                <!-- 2. إضافة منتج جديد -->
                <div class="card p-3">
                    <h5 class="fw-bold mb-3 text-warning"><i class="fas fa-plus-circle me-2"></i>إضافة منتج جديد</h5>
                    <form id="addProductForm" onsubmit="saveProduct(event)">
                        <div class="mb-2">
                            <label class="form-label small">اسم المنتج</label>
                            <input type="text" id="pName" class="form-control form-control-sm" placeholder="مثال: فستان سواريه" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">السعر (ج.م)</label>
                            <input type="number" id="pPrice" class="form-control form-control-sm" placeholder="مثال: 750" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">اختر صورة المنتج من الاستوديو/المعرض</label>
                            <input type="file" id="pImgFile" class="form-control form-control-sm" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn btn-gold btn-sm w-100 py-2"><i class="fas fa-save me-1"></i> حفظ وإضافة للمتجر</button>
                    </form>
                </div>
            </div>

            <!-- قائمة المنتجات الحالية -->
            <div class="col-md-7">
                <div class="card p-3">
                    <h5 class="fw-bold mb-3 text-warning"><i class="fas fa-boxes me-2"></i>المنتجات الحالية</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle small">
                            <thead>
                                <tr>
                                    <th>الصورة</th>
                                    <th>الاسم</th>
                                    <th>السعر</th>
                                    <th>حذف</th>
                                </tr>
                            </thead>
                            <tbody id="adminProductsList"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, name: "فستان سهرة أنيق", price: 850, img: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?q=80&w=500" },
            { id: 2, name: "عباية مودرن شيك", price: 650, img: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=500" }
        ];

        function getProducts() {
            const stored = localStorage.getItem('he_queen_custom_products');
            return stored ? JSON.parse(stored) : defaultProducts;
        }

        function renderAdminProducts() {
            const products = getProducts();
            const tbody = document.getElementById('adminProductsList');
            tbody.innerHTML = products.map((p, index) => `
                <tr>
                    <td><img src="${p.img}" class="product-img-preview" alt="${p.name}"></td>
                    <td>${p.name}</td>
                    <td>${p.price} ج.م</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${index})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function saveBanner(e) {
            e.preventDefault();
            const title = document.getElementById('bTitle').value.trim();
            const desc = document.getElementById('bDesc').value.trim();
            const fileInput = document.getElementById('bImgFile');

            let bannerData = JSON.parse(localStorage.getItem('he_queen_banner')) || {};
            if (title) bannerData.title = title;
            if (desc) bannerData.desc = desc;

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    bannerData.img = e.target.result;
                    localStorage.setItem('he_queen_banner', JSON.stringify(bannerData));
                    alert('تم حفظ تعديلات الغلاف بنجاح!');
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                localStorage.setItem('he_queen_banner', JSON.stringify(bannerData));
                alert('تم حفظ النصوص بنجاح!');
            }
        }

        function saveProduct(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value.trim();
            const price = parseFloat(document.getElementById('pPrice').value);
            const fileInput = document.getElementById('pImgFile');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgBase64 = e.target.result;
                    const products = getProducts();
                    products.push({ id: Date.now(), name, price, img: imgBase64 });
                    localStorage.setItem('he_queen_custom_products', JSON.stringify(products));

                    document.getElementById('addProductForm').reset();
                    renderAdminProducts();
                    alert('تمت إضافة المنتج بنجاح مع صوته!');
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function deleteProduct(index) {
            if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
                const products = getProducts();
                products.splice(index, 1);
                localStorage.setItem('he_queen_custom_products', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        renderAdminProducts();
    </script>
</body>
</html>
