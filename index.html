<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H.E-queen | متجر الموضة والأناقة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #d4af37; --secondary-color: #1a1a1a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; }
        .navbar { background-color: var(--secondary-color); border-bottom: 2px solid var(--primary-color); padding: 10px 0; }
        .navbar-brand { color: var(--primary-color) !important; font-weight: bold; font-size: 1.3rem; }
        
        /* البانر الجديد باستخدام صورة QUEEN */
        .hero-banner { 
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://raw.githubusercontent.com/lilyosama1990-hue/H.E-queen/main/banner.jpg') center/contain no-repeat #f3f3f0; 
            min-height: 250px; 
            color: #fff; 
            text-align: center; 
            padding: 40px 15px; 
            margin-bottom: 25px; 
            border-radius: 0 0 15px 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .product-card { border: none; border-radius: 12px; transition: transform 0.3s; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { height: 240px; object-fit: cover; border-radius: 12px 12px 0 0; }
        .btn-custom { background-color: var(--primary-color); color: #fff; font-weight: bold; border-radius: 8px; border: none; }
        .btn-custom:hover { background-color: #b59328; color: #fff; }
        .cart-badge { background-color: var(--primary-color); color: #fff; }
        .btn-login { border: 1px solid var(--primary-color); color: var(--primary-color); font-size: 0.85rem; padding: 4px 10px; border-radius: 6px; }
        .btn-login:hover { background-color: var(--primary-color); color: #000; }
        .user-welcome { color: var(--primary-color); font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar sticky-top">
        <div class="container d-flex justify-content-between align-items-center px-3">
            <a class="navbar-brand m-0" href="#"><i class="fas fa-crown me-1"></i>H.E-queen</a>
            
            <div class="d-flex align-items-center gap-2" id="navAuthArea">
                <button class="btn btn-login" data-bs-toggle="modal" data-bs-target="#authModal">
                    <i class="fas fa-user me-1"></i> دخول / تسجيل
                </button>
                
                <button class="btn btn-outline-light btn-sm position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
                    <i class="fas fa-shopping-bag fs-6"></i>
                    <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill cart-badge">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section Banner -->
    <div class="hero-banner" id="heroBanner">
        <div class="bg-dark bg-opacity-50 p-3 rounded d-inline-block">
            <h1 class="h4 fw-bold mb-1" id="heroTitle">QUEEN | فن الكونكريت</h1>
            <p class="lead fs-6 mb-0" id="heroDesc">أرقى التشكيلات والديكورات الحصرية - م/ حبيبة وائل</p>
        </div>
    </div>

    <!-- Products Grid -->
    <div class="container mb-5">
        <h4 class="fw-bold mb-3 border-bottom pb-2">منتجاتنا المميزة</h4>
        <div class="row g-3" id="productsContainer"></div>
    </div>

    <!-- Auth Modal (Clean & Simple) -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-warning">
                <div class="modal-header border-secondary">
                    <ul class="nav nav-pills card-header-pills" id="authTabs">
                        <li class="nav-item">
                            <button class="nav-link active btn-sm text-warning" id="tab-login" onclick="switchAuthTab('login')">تسجيل الدخول</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link btn-sm text-white" id="tab-register" onclick="switchAuthTab('register')">إنشاء حساب</button>
                        </li>
                    </ul>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label small">اسم المستخدم</label>
                            <input type="text" id="loginUser" class="form-control form-control-sm" placeholder="أدخل اسم المستخدم" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">كلمة المرور</label>
                            <input type="password" id="loginPass" class="form-control form-control-sm" placeholder="أدخل كلمة المرور" required>
                        </div>
                        <div id="loginError" class="text-danger small mb-2" style="display:none;">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
                        <button type="submit" class="btn btn-warning btn-sm w-100 fw-bold">تسجيل الدخول</button>
                    </form>

                    <form id="registerForm" onsubmit="handleRegister(event)" style="display:none;">
                        <div class="mb-3">
                            <label class="form-label small">الاسم بالكامل</label>
                            <input type="text" id="regName" class="form-control form-control-sm" placeholder="الاسم بالكامل" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">اسم المستخدم</label>
                            <input type="text" id="regUser" class="form-control form-control-sm" placeholder="اختر اسم مستخدم" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">كلمة المرور</label>
                            <input type="password" id="regPass" class="form-control form-control-sm" placeholder="كلمة المرور" required>
                        </div>
                        <div id="regMsg" class="small mb-2"></div>
                        <button type="submit" class="btn btn-success btn-sm w-100 fw-bold">إنشاء حساب</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- VIP Cart Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title"><i class="fas fa-shopping-cart text-warning me-2"></i>سلة التسوق</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cartItemsContainer"></div>

                    <div id="checkoutForm" class="mt-4 pt-3 border-top" style="display:none;">
                        <h6 class="fw-bold mb-3"><i class="fas fa-user-check me-2"></i>بيانات الشحن والإستلام:</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <input type="text" id="custName" class="form-control" placeholder="الاسم بالكامل *" required>
                            </div>
                            <div class="col-md-6">
                                <input type="tel" id="custPhone" class="form-control" placeholder="رقم الهاتف *" required>
                            </div>
                            <div class="col-md-6">
                                <select id="custGov" class="form-select" onchange="updateShippingCost()">
                                    <option value="50">القاهرة والجيزة (شحن 50 ج.م)</option>
                                    <option value="60">الإسكندرية والوجه البحري (شحن 60 ج.م)</option>
                                    <option value="70">الصعيد والمحافظات النائية (شحن 70 ج.م)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <input type="text" id="custAddress" class="form-control" placeholder="العنوان التفصيلي *" required>
                            </div>
                        </div>
                        <div class="mt-3 p-3 bg-light rounded d-flex justify-content-between align-items-center">
                            <div>
                                <div class="text-muted">تكلفة الشحن: <span id="shippingCost">50</span> ج.م</div>
                                <h5 class="fw-bold mb-0">الإجمالي الكلي: <span id="grandTotal" class="text-success">0</span> ج.م</h5>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                    <button type="button" id="submitOrderBtn" class="btn btn-custom px-4" onclick="submitOrder()"><i class="fab fa-whatsapp me-2"></i>إتمام الطلب عبر الواتساب</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const MANAGER_PHONE = "201028850287";

        const defaultProducts = [
            { id: 1, name: "فستان سهرة أنيق", price: 850, img: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?q=80&w=500" },
            { id: 2, name: "عباية مودرن شيك", price: 650, img: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=500" }
        ];

        function getProducts() {
            const stored = localStorage.getItem('he_queen_custom_products');
            return stored ? JSON.parse(stored) : defaultProducts;
        }

        let cart = JSON.parse(localStorage.getItem('he_queen_cart')) || [];
        let users = JSON.parse(localStorage.getItem('he_queen_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('he_queen_current_user')) || null;

        function loadBanner() {
            const bannerData = JSON.parse(localStorage.getItem('he_queen_banner'));
            if (bannerData) {
                if (bannerData.title) document.getElementById('heroTitle').innerText = bannerData.title;
                if (bannerData.desc) document.getElementById('heroDesc').innerText = bannerData.desc;
                if (bannerData.img) {
                    document.getElementById('heroBanner').style.background = `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('${bannerData.img}') center/contain no-repeat #f3f3f0`;
                }
            }
        }

        function checkUserStatus() {
            const area = document.getElementById('navAuthArea');
            if (currentUser) {
                let adminBtn = currentUser.user === "habiba" ? `<a href="admin.html" class="btn btn-sm btn-warning fw-bold me-1">🔓 لوحة الإدارة</a>` : '';
                area.innerHTML = `
                    <span class="user-welcome">أهلاً ${currentUser.name}</span>
                    ${adminBtn}
                    <button class="btn btn-outline-danger btn-sm p-1" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
                    <button class="btn btn-outline-light btn-sm position-relative ms-1" data-bs-toggle="modal" data-bs-target="#cartModal">
                        <i class="fas fa-shopping-bag fs-6"></i>
                        <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill cart-badge">0</span>
                    </button>
                `;
            }
        }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('tab-login').classList.add('active', 'text-warning');
                document.getElementById('tab-register').classList.remove('active', 'text-warning');
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('tab-register').classList.add('active', 'text-warning');
                document.getElementById('tab-login').classList.remove('active', 'text-warning');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const msg = document.getElementById('regMsg');

            if (user === 'habiba') {
                msg.className = "text-danger small mb-2";
                msg.innerText = "اسم المستخدم هذا محجوز!";
                return;
            }

            if (users.find(u => u.user === user)) {
                msg.className = "text-danger small mb-2";
                msg.innerText = "اسم المستخدم موجود بالفعل!";
                return;
            }

            users.push({ name, user, pass });
            localStorage.setItem('he_queen_users', JSON.stringify(users));

            msg.className = "text-success small mb-2";
            msg.innerText = "تم إنشاء الحساب بنجاح!";
            setTimeout(() => switchAuthTab('login'), 1200);
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (user === "habiba" && pass === "habiba1010") {
                currentUser = { name: "المديرة حبيبة", user: "habiba" };
                localStorage.setItem('he_queen_current_user', JSON.stringify(currentUser));
                window.location.href = "admin.html";
                return;
            }

            const foundUser = users.find(u => u.user === user && u.pass === pass);
            if (foundUser) {
                currentUser = foundUser;
                localStorage.setItem('he_queen_current_user', JSON.stringify(currentUser));
                location.reload();
            } else {
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('he_queen_current_user');
            location.reload();
        }

        function renderProducts() {
            const products = getProducts();
            const container = document.getElementById('productsContainer');
            container.innerHTML = products.map(p => `
                <div class="col-6 col-md-3">
                    <div class="card product-card h-100">
                        <img src="${p.img}" class="product-img card-img-top" alt="${p.name}">
                        <div class="card-body p-2 d-flex flex-column justify-content-between">
                            <h6 class="card-title fw-bold small mb-1">${p.name}</h6>
                            <div class="text-primary fw-bold small mb-2">${p.price} ج.م</div>
                            
                            <div class="row g-1 mb-2">
                                <div class="col-6">
                                    <select id="size-${p.id}" class="form-select form-select-sm p-1 fs-7">
                                        <option value="M">M</option>
                                        <option value="L">L</option>
                                        <option value="XL">XL</option>
                                        <option value="XXL">XXL</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <select id="color-${p.id}" class="form-select form-select-sm p-1 fs-7">
                                        <option value="أسود">أسود</option>
                                        <option value="أبيض">أبيض</option>
                                        <option value="بيج">بيج</option>
                                    </select>
                                </div>
                            </div>
                            <button class="btn btn-custom btn-sm w-100 py-1" onclick="addToCart(${p.id})"><i class="fas fa-cart-plus me-1"></i> إضافة</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const products = getProducts();
            const product = products.find(p => p.id === productId);
            const size = document.getElementById(`size-${productId}`).value;
            const color = document.getElementById(`color-${productId}`).value;

            const existingIndex = cart.findIndex(item => item.id === productId && item.size === size && item.color === color);

            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({ ...product, size, color, qty: 1 });
            }

            saveAndRenderCart();
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            saveAndRenderCart();
        }

        function saveAndRenderCart() {
            localStorage.setItem('he_queen_cart', JSON.stringify(cart));
            document.getElementById('cartCount').innerText = cart.reduce((acc, item) => acc + item.qty, 0);

            const container = document.getElementById('cartItemsContainer');
            const checkoutForm = document.getElementById('checkoutForm');
            const submitBtn = document.getElementById('submitOrderBtn');

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-muted"><i class="fas fa-shopping-basket fs-1 mb-2"></i><p>السلة فارغة حالياً</p></div>`;
                checkoutForm.style.display = 'none';
                submitBtn.style.display = 'none';
                return;
            }

            checkoutForm.style.display = 'block';
            submitBtn.style.display = 'inline-block';

            let itemsHtml = '<ul class="list-group mb-3">';
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                itemsHtml += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-0 fw-bold">${item.name}</h6>
                            <small class="text-muted">المقاس: ${item.size} | اللون: ${item.color} | السعر: ${item.price} ج.م</small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${index}, -1)">-</button>
                            <span class="fw-bold">${item.qty}</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${index}, 1)">+</button>
                            <span class="fw-bold ms-3">${itemTotal} ج.m</span>
                        </div>
                    </li>
                `;
            });
            itemsHtml += '</ul>';
            container.innerHTML = itemsHtml;
            updateShippingCost();
        }

        function updateShippingCost() {
            const shipping = parseInt(document.getElementById('custGov').value) || 50;
            document.getElementById('shippingCost').innerText = shipping;
            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            document.getElementById('grandTotal').innerText = subtotal + shipping;
        }

        function submitOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const shipping = document.getElementById('custGov').value;

            if (!name || !phone || !address) {
                alert('برجاء ملء جميع بيانات الاستلام لاستكمال الطلب');
                return;
            }

            let text = `👑 *طلب جديد من متجر H.E-queen* 👑\n\n`;
            text += `👤 *بيانات العميل:*\n`;
            text += `• الاسم: ${name}\n`;
            text += `• الهاتف: ${phone}\n`;
            text += `• العنوان: ${address}\n\n`;
            text += `🛍️ *الطلبات:*\n`;

            let subtotal = 0;
            cart.forEach((item, i) => {
                const total = item.price * item.qty;
                subtotal += total;
                text += `${i + 1}. ${item.name}\n   - المقاس: ${item.size}\n   - اللون: ${item.color}\n   - الكمية: ${item.qty}\n   - السعر: ${total} ج.م\n`;
            });

            const shippingCost = parseInt(shipping);
            const grandTotal = subtotal + shippingCost;

            text += `\n💵 *المبلغ:* ${subtotal} ج.م\n`;
            text += `🚚 *الشحن:* ${shippingCost} ج.م\n`;
            text += `💰 *الإجمالي الكلي:* ${grandTotal} ج.م\n`;

            const url = `https://wa.me/${MANAGER_PHONE}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        loadBanner();
        checkUserStatus();
        renderProducts();
        saveAndRenderCart();
    </script>
</body>
</html>
